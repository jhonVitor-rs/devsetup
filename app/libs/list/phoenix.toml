id = "phoenix"
name = "Phoenix (phx_new)"
check = "mix phx.new --version"
requires = ["elixir"]   # por enquanto ignorado pelo app (ver abaixo)

[install]
arc = "sudo pacman -S --needed --noconfirm inotify-tools && mix local.hex --force && mix local.rebar --force && mix archive.install hex phx_new --force"
deb = "sudo apt install -y inotify-tools && mix local.hex --force && mix local.rebar --force && mix archive.install hex phx_new --force"
mac = "mix local.hex --force && mix local.rebar --force && mix archive.install hex phx_new --force"
windows = "mix local.hex --force && mix local.rebar --force && mix archive.install hex phx_new --force"
