id = "k6"
name = "k6"
check = "k6 version"

[install]
arc = "sudo pacman -S --needed --noconfirm k6"
deb = "sudo sh -c 'apt-get install -y gnupg ca-certificates && gpg -k && gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 && echo \"deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main\" > /etc/apt/sources.list.d/k6.list && apt-get update && apt-get install -y k6'"
mac = "brew install k6"
windows = "winget install -e --id k6.k6 --accept-package-agreements --accept-source-agreements"
