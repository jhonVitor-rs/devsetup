id = "bun"
name = "Bun"
check = "bun --version || \"$HOME/.bun/bin/bun\" --version"

[install]
arc = "sudo pacman -S --needed --noconfirm curl unzip && curl -fsSL https://bun.sh/install | bash"
deb = "sudo apt install -y curl unzip && curl -fsSL https://bun.sh/install | bash"
mac = "brew install oven-sh/bun/bun"
windows = "winget install -e --id Oven-sh.Bun"
